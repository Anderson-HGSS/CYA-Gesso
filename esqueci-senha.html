<!doctype html>
<html lang="pt-BR" data-page="login">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar senha | CYA GESSO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">
    <main class="login-card bg-white mx-auto">
        <div class="text-center mb-4">
            <h1 class="login-brand">CYA GESSO</h1>
            <p class="login-description mb-0">Recupere o acesso à sua conta.</p>
        </div>
        <form id="recovery-form">
            <div class="mb-4"><label class="form-label" for="recovery-email">E-mail</label><input class="form-control"
                    id="recovery-email" type="email" required></div><button class="btn btn-primary w-100"
                type="submit">Enviar recuperação</button>
        </form><a class="d-block text-center small mt-4 text-decoration-none" href="index.html">Voltar ao Login</a>
    </main>
    <script type="module" src="js/esqueci-senha.js"></script>
</body>

</html>
