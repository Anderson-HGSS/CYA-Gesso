<!doctype html>
<html lang="pt-BR" data-page="login">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | CYA GESSO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">
    <main class="login-card bg-white mx-auto" aria-labelledby="login-title">
        <div class="text-center mb-4">
            <h1 id="login-title" class="login-brand mb-2">CYA GESSO</h1>
            <p class="login-description mb-0">Acesse o sistema de gestão da CYA GESSO.</p>
        </div>
        
        <form id="login-form">
            <div class="mb-3"><label class="form-label" for="login-email">E-mail ou usuário</label><input
                    class="form-control" id="login-email" type="text" placeholder="Digite seu e-mail"
                    autocomplete="username" name="email" required></div>
            <div class="mb-2"><label class="form-label" for="login-password">Senha</label><input class="form-control"
                    id="login-password" type="password" placeholder="Digite sua senha" autocomplete="current-password" name="password" required>
            </div>
            <div class="text-end mb-4"><a id="forgot-password" class="small text-decoration-none" href="esqueci-senha.html">Esqueci minha senha</a></div>
            <button class="btn btn-primary w-100 py-2" type="submit">Entrar</button>
        </form>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/auth.js"></script>
</body>

</html>
